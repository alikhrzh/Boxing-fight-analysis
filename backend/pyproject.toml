[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "boxing-fight-analysis-api"
version = "0.1.0"
description = "FastAPI application for managing boxing video analysis jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1,<25",
    "aiosqlite>=0.21,<1",
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
